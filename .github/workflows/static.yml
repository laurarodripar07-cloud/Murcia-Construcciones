  <div class="box" style="margin-top:16px"><h3>Recomendaciones de la Junta</h3>${rec.length?`<table class="t" style="margin-top:8px"><tr><th>Fecha</th><th>Proyecto</th><th>Recomendación</th><th>Propuesta por</th><th>Estado</th><th>Respuesta de la gerencia</th></tr>${rec.map(r=>`<tr><td>${fmt(r.fecha)}</td><td>${esc(r.proyecto)}</td><td>${esc(r.texto)}</td><td>${esc(r.frente)}</td><td><span class="pill ${lab[r.estado][1]}">${lab[r.estado][0]}</span>${canWrite&&r.estado==="analisis"?`<div style="margin-top:6px;display:flex;gap:4px"><button class="btn sec" style="padding:3px 7px;font-size:11px" data-r="${esc(r.id)}" data-s="incorporada">Incorporar</button><button class="btn sec" style="padding:3px 7px;font-size:11px" data-r="${esc(r.id)}" data-s="no">No</button></div>`:""}</td><td>${esc(r.respuesta||"")}</td></tr>`).join("")}</table>`:`<p class="empty">Aún no hay recomendaciones.</p>`}</div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=D.recomendaciones.find(y=>y.id===b.dataset.r);
