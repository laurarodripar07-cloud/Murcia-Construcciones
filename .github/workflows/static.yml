  <div class="err" id="eI"></div><div class="act"><button class="btn sec" data-x>Cancelar</button><button class="btn pri" id="sI">Registrar idea</button></div>`);
  $("sI").onclick=()=>{const t=$("iT").value.trim();if(t.length<8)return $("eI").textContent="Describe la idea con un poco más de detalle.";const an=$("iX").checked;
    put("ideas",null,{texto:t,frente:$("iF").value,tema:$("iC").value,canal:$("iN").value,autor:an?"":$("iA").value.trim(),anonima:an,estado:"peaje",fechaIngreso:today(),historial:[{f:today(),e:"peaje",t:"Idea registrada"}]},"eI","Idea registrada")};
}
function resIdea(id){
  const c=D.ideas.find(i=>i.id===id);if(!c)return;let ns=null;
  const al={peaje:["estudio","verde","rojo"],estudio:["verde","rojo"],verde:["hecha","rojo"],rojo:["estudio"],hecha:[]}[c.estado];
  modal(`<h3>${esc(c.texto)}</h3><p class="muted">${esc(c.frente)} · ${esc(c.tema)} · ${EST[c.estado].n}</p>
  <label class="l">Nuevo estado</label><div class="states">${["estudio","verde","rojo","hecha"].map(s=>`<button class="st" data-s="${s}" ${al.includes(s)&&canWrite?"":"disabled"}><i style="background:${EST[s].c}"></i>${EST[s].n}</button>`).join("")}</div>
  <div id="rf"></div><label class="l">Historial</label><div class="hist">${(c.historial||[]).map(h=>`<div><b>${fmt(h.f)}</b> · ${esc(EST[h.e]?.n||h.e)}: ${esc(h.t)}</div>`).join("")}</div>
  <div class="err" id="eR"></div><div class="act"><button class="btn sec" data-x>Cerrar</button>${canWrite&&al.length?`<button class="btn pri" id="sR">Guardar respuesta</button>`:""}</div>`);
  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{if(b.disabled)return;ns=b.dataset.s;document.querySelectorAll(".st").forEach(x=>x.classList.toggle("on",x===b));
    $("rf").innerHTML=ns==="verde"?`<div class="row2"><div><label class="l">Responsable</label><input class="i" id="rP"></div><div><label class="l">Fecha de compromiso</label><input class="i" type="date" id="rD"></div></div>`:`<label class="l">${ns==="rojo"?"Razón (se explicará en Radio Vía)":"Comentario"}</label><textarea class="i" id="rT" maxlength="300"></textarea>`});
  if($("sR"))$("sR").onclick=()=>{
    if(!ns)return $("eR").textContent="Elige el nuevo estado.";const u={estado:ns};const r=($("rT")?.value||"").trim();
    if(ns==="verde"){const p=$("rP").value.trim(),f=$("rD").value;if(!p||!f)return $("eR").textContent="La vía libre necesita responsable y fecha.";u.responsable=p;u.fechaCompromiso=f}
    if(ns==="rojo"&&r.length<5)return $("eR").textContent="La regla del peaje exige explicar la razón.";
    if(r)u.respuesta=r;if(ns==="hecha")u.fechaImplementada=today();if(!c.fechaRespuesta)u.fechaRespuesta=today();
    u.historial=[...(c.historial||[]),{f:today(),e:ns,t:ns==="verde"?`Aprobada · ${u.responsable}`:(r||EST[ns].n)}];
    const body={...c,...u};delete body.id;put("ideas",c.id,body,"eR","Respuesta guardada")};
}

