function speak(i,btn){
  const ss=window.speechSynthesis;if(!ss){toast("El audio no está disponible en este navegador");return}
  if(ss.speaking){ss.cancel();document.querySelectorAll(".play").forEach(b=>b.textContent="▶");return}
  const u=new SpeechSynthesisUtterance(RADIO[i].g);u.lang="es-CO";
  const v=ss.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v;u.rate=1;
  u.onend=u.onerror=()=>{btn.textContent="▶"};btn.textContent="■";ss.speak(u);
}
