   <div class="err" id="eC"></div><button class="btn nav" id="sC">Guardar configuración</button></div>`:""}`;
  if($("sC"))$("sC").onclick=async()=>{const ok=u=>!u||/^https:\/\//.test(u);const d={formClima:$("c1").value.trim(),formLiderazgo:$("c2").value.trim(),formActa:$("c3").value.trim(),climaBase:$("c4").value,climaActual:$("c5").value,liderazgoBase:$("c6").value,liderazgoActual:$("c7").value,totalTrabajadores:$("c8").value||170};
    if(![d.formClima,d.formLiderazgo,d.formActa].every(ok))return $("eC").textContent="Los enlaces deben empezar por https://";
