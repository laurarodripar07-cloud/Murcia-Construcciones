  <div class="box" style="margin-top:16px"><h3>Bitácoras del casco</h3>${bits.length?`<table class="t" style="margin-top:8px"><tr><th>Fecha</th><th>Directivo</th><th>Frente · Maestro de Vía</th><th>Aprendizaje</th><th>Compromiso</th><th>Estado</th></tr>${bits.map(b=>`<tr><td>${fmt(b.fecha)}</td><td>${esc(b.directivo)}</td><td>${esc(b.frente)} · ${esc(b.maestro)}</td><td>${esc(b.aprendizaje)}</td><td>${esc(b.compromiso)}</td><td>${b.cumplido===true?`<span class="pill g">Cumplido</span>`:b.cumplido===false?`<span class="pill r">No cumplido</span>`:`<span class="pill y">Por verificar</span>${canWrite?` <button class="btn sec" style="padding:3px 8px;font-size:11px" data-ok="${esc(b.id)}">Cumplido</button>`:""}`}</td></tr>`).join("")}</table>`:`<p class="empty">Aún no hay bitácoras.</p>`}</div>`;
