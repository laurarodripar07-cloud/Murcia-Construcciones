/* Kilómetros */
function vKm(){
  $("topact").innerHTML=`<button class="btn pri" id="bFi">+ Entregar ficha de peaje</button>`;$("bFi").onclick=formFicha;
  const ps=personas();sub.p=sub.p&&ps.some(p=>norm(p.n)===norm(sub.p))?sub.p:(ps[0]?.n||"");
  const km=kmDe(sub.p);const sig=HITOS.find(h=>h.km>km);const pct=Math.min(100,km/300*100);
  const recientes=[...D.fichas].sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,8);
  $("view").innerHTML=`<div class="grid g2" style="align-items:start">
  <div><div class="pass"><h3>Pasaporte de Vía</h3><div class="row2" style="margin-top:6px"><div><label class="l" style="color:#fff">Consultar el pasaporte de</label><select class="i" id="pSel">${ps.map(p=>`<option${norm(p.n)===norm(sub.p)?" selected":""}>${esc(p.n)}</option>`).join("")}</select></div><div style="text-align:right"><b style="font-size:40px;font-weight:800;color:var(--yellow)">${km}</b><div style="font-size:12px;opacity:.8">kilómetros</div></div></div>
    <div class="bar"><div style="width:${pct}%"></div></div><div style="font-size:12px;opacity:.85">${sig?`Faltan ${sig.km-km} km para: ${sig.t}`:"¡Recorrió todas las metas!"}</div>
    <div class="hitos">${HITOS.map(h=>`<div class="hito ${km>=h.km?"ok":""}"><b>Km ${h.km}</b>${h.t}</div>`).join("")}</div></div>
    <div class="box" style="margin-top:16px"><h3>Reglas del juego</h3><p>Cada trabajador recibe <b>3 fichas al mes</b> para entregar a compañeros que se destaquen en seguridad, cuidado de los equipos, ayuda a otros o ideas de mejora. Cada ficha vale <b>10 km</b> y cada idea propia que pasa a verde en el Peaje suma <b>20 km</b>. No se pueden dar fichas a uno mismo ni al jefe directo.</p></div></div>
  <div><div class="box"><h3>Tabla de la vía</h3><table class="t" style="margin-top:8px"><tr><th>#</th><th>Persona</th><th>Frente</th><th>Km</th></tr>${ps.slice(0,10).map((p,k)=>`<tr><td>${k+1}</td><td>${esc(p.n)}</td><td>${esc(p.fr||"")}</td><td><b>${p.km}</b></td></tr>`).join("")||`<tr><td colspan="4" class="empty">Aún no hay kilómetros.</td></tr>`}</table></div>
  <div class="box" style="margin-top:16px"><h3>Fichas recientes</h3>${recientes.map(f=>`<p style="font-size:13px;border-bottom:1px solid var(--line);padding:6px 0"><b>${esc(f.de)}</b> → <b>${esc(f.para)}</b> · <span class="pill">${esc(f.motivo)}</span><br><span class="muted">«${esc(f.mensaje)}» · ${fmt(f.fecha)}</span></p>`).join("")||`<p class="empty">Aún no hay fichas.</p>`}</div>
  <div class="box" style="margin-top:16px"><h3>Mojones de lealtad del año</h3><table class="t" style="margin-top:8px"><tr><th>Trabajador</th><th>Frente</th><th>Años</th></tr>${MOJONES.map(m=>`<tr><td>${m.p}</td><td>${m.fr}</td><td><b>${m.a}</b></td></tr>`).join("")}</table></div></div></div>`;
  $("pSel")&&($("pSel").onchange=e=>{sub.p=e.target.value;render()});
}
function formFicha(){
  if(!canWrite)return toast("Tu acceso es solo de consulta");
  modal(`<h3>Entregar ficha de peaje</h3><p class="muted">+10 km para tu compañero. Tienes 3 fichas al mes.</p>
  <div class="row2"><div><label class="l">Quién la entrega</label><input class="i" id="fD" maxlength="60"></div><div><label class="l">Para quién</label><input class="i" id="fP" maxlength="60" list="pl"><datalist id="pl">${personas().map(p=>`<option>${esc(p.n)}</option>`).join("")}</datalist></div></div>
