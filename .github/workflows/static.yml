/* ---------- modal y datos ---------- */
function modal(h){$("md").innerHTML=h;$("ov").classList.add("on");$("md").querySelectorAll("[data-x]").forEach(b=>b.onclick=closeM);const f=$("md").querySelector("input,textarea");if(f)f.focus()}
function closeM(){$("ov").classList.remove("on")}
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeM()});
function errMsg(e){const c=e&&e.code;if(c==="quota_exceeded")return"La base de datos está llena.";if(c==="invalid_argument"){canWrite=false;canAdmin=false;$("ro").classList.remove("hide");return"Tu acceso no permite guardar cambios."}return"No se pudo guardar. Intenta de nuevo."}
async function put(colName,id,data,errId,okMsg){
  const btn=$("md").querySelector(".btn.pri");if(btn)btn.disabled=true;
  try{
    if(demo){if(id)D[colName]=D[colName].map(x=>x.id===id?{...data,id}:x);else D[colName].push({...data,id:"d"+Date.now()});persist();render()}
    else{if(id)await db.collection(colName).doc(id).set(data);else await db.collection(colName).add(data)}
    closeM();render();toast(okMsg);
  }catch(e){if(errId&&$(errId))$(errId).textContent=errMsg(e);else toast(errMsg(e))}
  if(btn)btn.disabled=false;
