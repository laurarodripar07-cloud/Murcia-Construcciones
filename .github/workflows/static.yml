function cardIdea(i){
  const d=days(i.fechaIngreso);let tg=`<span class="tg">${esc(i.frente)}</span><span class="tg">${esc(i.tema)}</span>`;
  if(i.estado==="peaje")tg+=vencida(i)?`<span class="tg alert">${d} días sin respuesta</span>`:`<span class="tg">Día ${d} de 15</span>`;
  else if(i.fechaRespuesta){const t=days(i.fechaIngreso,i.fechaRespuesta);tg+=`<span class="tg ${t<=15?"ok":"alert"}">Respondida en ${t} días</span>`}
  let r="";if(i.estado==="verde")r=`<b>Resp.:</b> ${esc(i.responsable)} · ${fmt(i.fechaCompromiso)}`;if(i.estado==="rojo")r=`<b>Razón:</b> ${esc(i.respuesta)}`;if(i.estado==="estudio"&&i.respuesta)r=esc(i.respuesta);if(i.estado==="hecha")r=`Implementada el ${fmt(i.fechaImplementada)}`;
  return `<div class="card ${i.estado}" data-id="${esc(i.id)}"><div class="tt">${esc(i.texto)}</div><div class="m">${tg}</div>${r?`<div class="r">${r}</div>`:""}<div class="r muted">${i.anonima?"Anónima":esc(i.autor||"Sin nombre")} · ${esc(i.canal)}</div></div>`;
}
function formIdea(){
  if(!canWrite)return toast("Tu acceso es solo de consulta");
  modal(`<h3>Pagar peaje</h3><p class="muted">Registra una idea. Desde hoy corre el plazo de 15 días para responderla.</p>
