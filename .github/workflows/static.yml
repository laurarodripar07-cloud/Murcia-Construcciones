  <label class="l">¿Por qué se la das? (una frase)</label><input class="i" id="fT" maxlength="140">
  <div class="err" id="eF"></div><div class="act"><button class="btn sec" data-x>Cancelar</button><button class="btn pri" id="sF">Entregar ficha</button></div>`);
  $("sF").onclick=()=>{const d={de:$("fD").value.trim(),para:$("fP").value.trim(),frentePara:$("fF").value,motivo:$("fM").value,mensaje:$("fT").value.trim(),fecha:today()};
    if(!d.de||!d.para||!d.mensaje)return $("eF").textContent="Completa quién entrega, quién recibe y por qué.";
