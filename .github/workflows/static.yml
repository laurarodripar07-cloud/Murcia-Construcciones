<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>En la Misma Vía · Portal interno (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#002060;--navy2:#0B2E78;--red:#C8102E;--yellow:#F2B705;--green:#2E9E4F;--gray:#7A8599;--bg:#F4F6FA;--line:#DDE3EE;--ink:#1B2333;--soft:#EEF2FA}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:linear-gradient(to right,var(--navy) 250px,var(--bg) 250px)}
nav{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.logo b{display:block;font-size:19px;font-weight:800;letter-spacing:.2px}
.logo b span{color:var(--yellow)}
.logo small{display:block;font-size:10.5px;opacity:.7;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px;line-height:1.4}
.ng{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;opacity:.55;margin:14px 8px 6px;font-weight:700}
nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13.5px;opacity:.88}
nav a:hover{background:rgba(255,255,255,.08);opacity:1}
nav a.on{background:#fff;color:var(--navy);opacity:1}
nav a i{font-style:normal;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.14);flex:none}
nav a.on i{background:var(--red);color:#fff}
.navfoot{font-size:11px;opacity:.6;margin:22px 8px 0;line-height:1.5}
main{min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;color:var(--navy)}
.top .crumb{font-size:12px;color:var(--gray);font-weight:600}
.top .sp{flex:1}
.road{height:8px;background:#2b2b2b;position:relative}
.road:after{content:"";position:absolute;left:0;right:0;top:3px;border-top:2px dashed var(--yellow)}
.wrap{padding:22px 28px 40px;max-width:1400px}
.note{background:#FFF6D6;border:1px solid #F2D27A;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.hide{display:none!important}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font-size:13px}
.btn.pri{background:var(--red);color:#fff}.btn.nav{background:var(--navy);color:#fff}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.box h3{margin:0 0 4px;font-size:16px;color:var(--navy);font-weight:800}
.box h4{margin:12px 0 6px;font-size:13.5px;color:var(--navy);font-weight:800}
.box p{margin:4px 0}
.muted{color:var(--gray);font-size:12.5px}
.hero{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:24px 26px;position:relative;overflow:hidden}
.hero h2{margin:0 0 6px;font-size:26px;font-weight:800}
.hero p{margin:0;max-width:760px;opacity:.9}
.hero .tag{background:var(--red);color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;display:inline-block;margin-bottom:10px;letter-spacing:.5px}
.tramo{border-top:5px solid var(--red);cursor:pointer;transition:transform .1s}
.tramo:hover{transform:translateY(-2px)}
.tramo .n{font-size:11px;font-weight:800;color:var(--red);letter-spacing:1px}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--navy)}
.kpi span{font-size:12px;color:var(--gray);display:block}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--navy)}
.pill.g{background:#E3F4E8;color:#1E6B35}.pill.r{background:#FBE3E7;color:var(--red)}.pill.y{background:#FFF3CC;color:#8A6A00}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:700;font-size:12px}
table.t td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.t tr:nth-child(even) td{background:#FAFBFD}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
label.l{display:block;font-weight:700;font-size:12.5px;color:var(--navy);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;font:inherit;padding:8px 11px;border:2px solid var(--line);border-radius:10px;background:#fff}
textarea.i{min-height:70px;resize:vertical}
.err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.agenda{display:grid;gap:8px}
.ag{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start;background:var(--soft);border-radius:10px;padding:10px 12px}
.ag b.m{background:var(--navy);color:#fff;border-radius:8px;text-align:center;padding:6px 0;font-size:12px}
.ag em{display:block;font-style:normal;color:#444;font-size:12.5px;margin-top:3px}
.ag q{display:block;color:var(--navy);font-style:italic;font-size:12.5px;margin-top:4px}
/* peaje board */
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;align-items:start}
.col{background:#fff;border-radius:14px;border:1px solid var(--line)}
.col h2{margin:0;font-size:13.5px;font-weight:800;padding:11px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.col h2 .dot{width:13px;height:13px;border-radius:50%}
.col h2 .n{margin-left:auto;background:var(--bg);border-radius:10px;padding:1px 8px;font-size:12px}
.list{padding:9px;display:flex;flex-direction:column;gap:9px}
.card{border:1px solid var(--line);border-left:6px solid var(--gray);border-radius:10px;padding:9px 11px;background:#fff;cursor:pointer}
.card:hover{box-shadow:0 3px 10px rgba(0,32,96,.08)}
.card.estudio{border-left-color:var(--yellow)}.card.verde{border-left-color:var(--green)}.card.rojo{border-left-color:var(--red)}.card.hecha{border-left-color:var(--navy)}
.card .tt{font-weight:600;line-height:1.35;font-size:13px}
.card .m{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.card .r{font-size:12px;color:#444;margin-top:6px}
.tg{font-size:10.5px;font-weight:600;background:var(--bg);color:var(--navy);border-radius:6px;padding:2px 6px}
.tg.alert{background:var(--red);color:#fff}.tg.ok{background:#E3F4E8;color:#1E6B35}
.empty{color:var(--gray);font-size:12px;text-align:center;padding:14px 6px}
/* signs */
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sg{text-align:center}
.shape{margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.oct{width:96px;height:96px;background:var(--red);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);font-size:18px}
.tri{width:112px;height:98px;background:var(--yellow);clip-path:polygon(0 0,100% 0,50% 100%);color:var(--navy);font-size:12px;line-height:1.15;text-align:center;padding-bottom:40px}
.dia{width:78px;height:78px;background:var(--yellow);transform:rotate(45deg);margin:9px auto 17px}
.dia span{transform:rotate(-45deg);color:var(--navy);font-size:12px}
.cir{width:96px;height:96px;border-radius:50%;background:var(--green);font-size:15px;line-height:1.1;text-align:center}
.sg p{font-size:12.5px;margin:0}
/* passport */
.pass{background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px}
.pass h3{color:#fff}
.bar{height:14px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin:12px 0 6px}
.bar div{height:100%;background:var(--yellow)}
.hitos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.hito{background:rgba(255,255,255,.1);border-radius:10px;padding:8px;font-size:11.5px}
.hito.ok{background:var(--yellow);color:var(--navy)}
.hito b{display:block;font-size:14px}
.ind{border-left:6px solid var(--gray)}
.ind.ok{border-left-color:var(--green)}.ind.no{border-left-color:var(--red)}
.ind b.v{font-size:28px;font-weight:800;color:var(--navy);display:block}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,20,60,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.ov.on{display:flex}
.md{background:#fff;border-radius:16px;width:min(560px,100%);padding:22px 24px}
.md h3{margin:0 0 4px;font-size:19px;color:var(--navy);font-weight:800}
.md .act{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{border:2px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;font-size:12px;cursor:pointer;background:#fff;font-family:inherit}
.st i{display:block;width:15px;height:15px;border-radius:50%;margin:0 auto 4px}
.st.on{border-color:var(--navy);background:var(--soft)}
.st:disabled{opacity:.35;cursor:not-allowed}
.hist{background:var(--bg);border-radius:10px;padding:9px 12px;font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:20}
.ep{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0}
.ep:last-child{border:0}
.ep .play{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:15px;cursor:pointer;flex:none}
.ep .play:disabled{background:var(--gray);cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;border-top:5px solid var(--navy)}
.cal .d b{font-size:15px;color:var(--navy);display:block}
@media(max-width:1100px){.app{grid-template-columns:1fr;background:var(--bg)}nav{position:static;height:auto}.g4,.g5,.cal{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g4,.g5,.cal,.board,.signs,.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav id="nav"></nav>
<main>
  <div class="top"><div><div class="crumb" id="crumb"></div><h1 id="title"></h1></div><div class="sp"></div><div id="topact"></div></div>
  <div class="road"></div>
  <div class="wrap">
    <div class="note hide" id="demo">Prototipo: la información que registres se guarda solo en este navegador. <button class="btn sec" id="bReset" style="padding:3px 10px;font-size:12px;margin-left:8px">Restablecer datos de ejemplo</button></div>
    <div class="note hide" id="ro">Puedes consultar el portal, pero tu nivel de acceso no permite registrar información.</div>
    <div id="view"></div>
  </div>
</main>
</div>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constantes ---------- */
const FRENTES=["Mina","Planta de asfalto","Obras","Oficinas"];
const TEMAS=["Seguridad","Cuidado de equipos","Procesos y productividad","Bienestar","Nuevos proyectos de urbanismo"];
const CANALES=["Encuentro Kilómetro Cero","Nota de voz","Buzón","Portal"];
const MOTIVOS=["Seguridad","Cuidado de los equipos","Ayuda a otros","Idea de mejora"];
const EST={peaje:{n:"En el peaje",c:"var(--gray)"},estudio:{n:"En estudio",c:"var(--yellow)"},verde:{n:"Vía libre",c:"var(--green)"},rojo:{n:"No viable",c:"var(--red)"},hecha:{n:"Implementada",c:"var(--navy)"}};
const ORDER=["peaje","estudio","verde","rojo","hecha"];
const DIAS_ENC={"Mina":1,"Planta de asfalto":2,"Obras":3,"Oficinas":4}; // lunes..jueves de la primera semana
const HITOS=[{km:50,t:"Mención en Radio Vía y carta de la gerencia"},{km:100,t:"Almuerzo con la gerencia y la junta directiva"},{km:200,t:"Día de la familia en la obra o curso certificado"},{km:300,t:"Su nombre en la placa de un proyecto nuevo"}];
const VIEWS=[
 {id:"inicio",n:"Inicio",i:"⌂",g:""},
 {id:"kilometro-cero",n:"Encuentro Kilómetro Cero",i:"1",g:"Tramo 1"},
 {id:"radio-via",n:"Radio Vía",i:"1",g:"Tramo 1"},
 {id:"peaje",n:"Peaje de Ideas",i:"1",g:"Tramo 1"},
 {id:"cambio-de-casco",n:"Cambio de Casco",i:"2",g:"Tramo 2"},
 {id:"junta",n:"Junta de la Vía",i:"3",g:"Tramo 3"},
 {id:"kilometros",n:"Kilómetros Murcia",i:"4",g:"Tramo 4"},
 {id:"encuestas",n:"Encuestas",i:"✎",g:"Seguimiento"},
 {id:"indicadores",n:"Indicadores",i:"%",g:"Seguimiento"}
];
const RADIO=[
 {f:"Semana 3 · noviembre",t:"Cuentas claras y primeras ideas en verde",g:"Buenos días, equipo. Les habla la gerencia con la Radio Vía de esta semana. Así va la empresa: seguimos preparando la propuesta para el primer parque industrial y esta semana revisamos los planos con la Junta de la Vía. Las cuentas claras: la nómina de la primera quincena se pagará el viernes; sabemos que el retraso del mes pasado afectó a muchas familias y por eso les contamos la fecha real. Respondemos al aire: la idea de señalizar el retorno de volquetas en la mina ya es una realidad, gracias al conductor que la propuso. Kilómetros de la semana: felicitaciones a quienes más fichas recibieron por cuidar los equipos. Nos vemos en la vía."},
 {f:"Semana 2 · noviembre",t:"Así arranca En la Misma Vía",g:"Buenos días. Esta es la primera Radio Vía. Cada semana, en tres minutos, les vamos a contar cómo va la empresa, cuándo se paga, qué pasó con sus ideas y a quién reconocieron sus compañeros. Si tienen una pregunta, respondan con una nota de voz y la contestamos aquí. El primer encuentro Kilómetro Cero será en cada frente durante la primera semana del mes. Nos vemos en la vía."}
];
const JUNTA=[
 {fr:"Mina",a:"Operario de cargue (24 años en la empresa)",b:"Ayudante de mina (2 años)"},
 {fr:"Planta de asfalto",a:"Operador de planta (18 años)",b:"Laboratorista (3 años)"},
 {fr:"Obras",a:"Operador de motoniveladora (21 años)",b:"Auxiliar de topografía (1 año)"},
 {fr:"Oficinas",a:"Auxiliar contable (15 años)",b:"Asistente de compras (2 años)"}
];
const MOJONES=[{p:"Operario de mina",a:20,fr:"Mina"},{p:"Conductor de volqueta",a:15,fr:"Obras"},{p:"Operador de planta",a:10,fr:"Planta de asfalto"},{p:"Auxiliar contable",a:5,fr:"Oficinas"}];

/* ---------- estado ---------- */
let D={ideas:[],actas:[],bitacoras:[],recomendaciones:[],fichas:[]}, CFG={};
let db=null, demo=false, canWrite=true, canAdmin=true, tts=null, view="inicio", sub={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today=()=>iso(new Date());
const days=(a,b)=>Math.round((new Date((b||today())+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"}):"";
const fmtL=d=>new Date(d+"T12:00:00").toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
const mes=d=>(d||today()).slice(0,7);
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
const opts=(a,sel)=>a.map(x=>`<option${x===sel?" selected":""}>${esc(x)}</option>`).join("");

/* ---------- navegación ---------- */
function drawNav(){
  let h=`<div class="logo"><b>En la Misma <span>Vía</span></b><small>Portal interno · prototipo<br>Murcia Construcciones S.A.S.</small></div>`;let g=null;
  VIEWS.forEach(v=>{if(v.g!==g){g=v.g;if(g)h+=`<div class="ng">${g}</div>`}h+=`<a href="#${v.id}" class="${v.id===view?"on":""}"><i>${v.i}</i>${v.n}</a>`});
  h+=`<div class="navfoot">Prototipo académico de MAVES Consulting. Los datos cargados son ejemplos ilustrativos.</div>`;
  $("nav").innerHTML=h;
}
function route(){const h=location.hash.slice(1);view=VIEWS.some(v=>v.id===h)?h:"inicio";drawNav();render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

function render(){
  const v=VIEWS.find(x=>x.id===view);
  $("crumb").textContent=v.g||"MAVES Consulting · Prototipo";$("title").textContent=v.id==="inicio"?"Bienvenido a En la Misma Vía":v.n;
  $("topact").innerHTML="";
  ({inicio:vInicio,"kilometro-cero":vKm0,"radio-via":vRadio,peaje:vPeaje,"cambio-de-casco":vCasco,junta:vJunta,kilometros:vKm,encuestas:vEnc,indicadores:vInd})[view]();
}

/* ---------- fechas de encuentros ---------- */
function encuentroDe(fr,ym){ // primer lunes..jueves del mes
  const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1,1);
  while(d.getDay()!==1)d.setDate(d.getDate()+1);
  d.setDate(d.getDate()+DIAS_ENC[fr]-1);return iso(d);
}
function nextYm(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);return iso(d).slice(0,7)}
function proximoEnc(fr){const e=encuentroDe(fr,mes());return e>=today()?e:encuentroDe(fr,nextYm())}

/* ---------- indicadores ---------- */
function vencida(i){return i.estado==="peaje"&&days(i.fechaIngreso)>15}
function kmDe(nombre){
  const n=norm(nombre);if(!n)return 0;
  return D.fichas.filter(f=>norm(f.para)===n).length*10+D.ideas.filter(i=>!i.anonima&&norm(i.autor)===n&&(i.estado==="verde"||i.estado==="hecha")).length*20;
}
function personas(){const s=new Map();D.fichas.forEach(f=>{s.set(norm(f.para),{n:f.para,fr:f.frentePara})});D.ideas.forEach(i=>{if(!i.anonima&&i.autor&&!s.has(norm(i.autor)))s.set(norm(i.autor),{n:i.autor,fr:i.frente})});return [...s.values()].map(p=>({...p,km:kmDe(p.n)})).sort((a,b)=>b.km-a.km)}
function indicadores(){
  const I=D.ideas, debian=I.filter(i=>i.fechaRespuesta||vencida(i)), aT=I.filter(i=>i.fechaRespuesta&&days(i.fechaIngreso,i.fechaRespuesta)<=15);
  const pct=(a,b)=>b?Math.round(a/b*100):null;
  const m=mes(); const dadores=new Set(D.fichas.filter(f=>mes(f.fecha)===m).map(f=>norm(f.de))).size;
  const total=Number(CFG.totalTrabajadores)||170;
  const rec=D.recomendaciones, recDec=rec.filter(r=>r.estado!=="analisis");
  const inicio=CFG.inicioPrograma||D.actas.map(a=>mes(a.fecha)).sort()[0]||mes();
  const trimestre=[0,1,2].map(k=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);return iso(d).slice(0,7)}).filter(ym=>ym>=inicio);
  const actasTri=new Set(D.actas.filter(a=>trimestre.includes(mes(a.fecha))).map(a=>a.frente+mes(a.fecha))).size;
  const progTri=trimestre.reduce((s,ym)=>s+FRENTES.filter(fr=>encuentroDe(fr,ym)<=today()).length,0);
  const dif=(a,b)=>(a!=null&&a!==""&&b!=null&&b!=="")?Number(a)-Number(b):null;
  return [
    {n:"Respuesta oportuna a ideas",v:pct(aT.length,debian.length),u:" %",meta:90,f:"Ideas respondidas en 15 días o menos / ideas que ya debían tener respuesta",src:"Peaje de Ideas",fr:"Mensual"},
    {n:"Ideas implementadas",v:pct(I.filter(i=>i.estado==="hecha").length,I.length),u:" %",meta:25,f:"Ideas implementadas / ideas recibidas",src:"Peaje de Ideas",fr:"Trimestral"},
